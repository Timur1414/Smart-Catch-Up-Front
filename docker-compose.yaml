include:
  - back/docker-compose.yaml  # заменить на нужный путь

services:
  frontend:
    image: timur1414/scu-frontend:latest
    container_name: frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api-gateway:
        condition: service_healthy
    volumes:
      - ./back/static:/app/back/static:ro  # заменить на нужный путь
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - scu-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - scu-network
