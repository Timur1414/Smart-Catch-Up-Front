<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VK Smart Catch-Up</title>
    <style>
        body {
            width: 320px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #222222;
        }
        h2 {
            margin: 0 0 12px;
            font-size: 16px;
            color: #0077FF;

            align-items: center;

        }

    <h2>
        <img src="/icons/icon16.png" alt="logo" width="16" height="16">

        Умная лента и быстрое погружение в пропущенные события VK.
    </div>
    <div class="status-badge" id="status">
        Расширение активно
    </div>
    <script type="module" src="./popup.ts"></script>
